<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thermal Debt Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{--navy:#173a69;--navy2:#112337;--sky:#4f8bc9;--gold:#edd21c;--ink:#14213a;--ink2:#4b5566;--ink3:#7a8494;--line:#dfe4ec;--bg:#f6f8fb;--card:#fff;--heat:#c4561f;--cool:#1a6fd3;--crit:#b01f2a}
@media (prefers-color-scheme:dark){:root{--ink:#eef2f7;--ink2:#b9c2cf;--ink3:#8b95a5;--line:#2a3547;--bg:#0f1622;--card:#161f2e}}
*{box-sizing:border-box}
body{margin:0;width:360px;font:13px/1.45 "Open Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
header img{width:30px;height:30px;border-radius:8px}
header .nm{font-family:"Bebas Neue",Impact,sans-serif;font-size:20px;letter-spacing:.02em;line-height:1}
header .sb{font-size:11px;color:#c9d6ea}
main{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.now{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.now .t{font-family:"Bebas Neue",Impact,sans-serif;font-size:44px;line-height:1;color:var(--navy)}
@media (prefers-color-scheme:dark){.now .t{color:#fff}}
.now .d{font-size:12px;color:var(--ink2)}
.now .d b{color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.k .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.k .v{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;line-height:1.1;margin-top:2px}
.k .s{font-size:11px;color:var(--ink3)}
.al{border-left:4px solid var(--heat);background:var(--card);border-radius:0 8px 8px 0;padding:7px 10px;font-size:12px}
.al b{display:block}
.al.severe{border-left-color:var(--crit)} .al.cold{border-left-color:var(--cool)} .al.air{border-left-color:#7a5cc4}
.al .r{color:var(--ink2);font-size:11.5px}
.bars{display:flex;gap:2px;align-items:flex-end;height:46px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px 4px}
.bars i{flex:1;display:block;border-radius:2px 2px 0 0;background:var(--sky);min-height:2px}
.bars i.h95{background:#e0a020}.bars i.h100{background:var(--heat)}.bars i.h105{background:var(--crit)}.bars i.night{opacity:.55}
.lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);padding:0 2px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;border-radius:8px;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
button.p{background:var(--navy);color:#fff;border-color:var(--navy)}
button.g{background:var(--gold);color:#112337;border-color:var(--gold)}
button:hover{filter:brightness(1.05)}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink3)}
.foot a,.foot button.lnk{color:var(--sky);background:none;border:0;padding:0;font-weight:400;text-decoration:underline;cursor:pointer;font-size:11px}
.err{background:#fff3f0;border:1px solid #f0c8bf;color:#8a2a1a;border-radius:8px;padding:8px 10px;font-size:12px}
@media (prefers-color-scheme:dark){.err{background:#3a1d18;border-color:#6a2e24;color:#ffd8cf}}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><div><div class="nm">Thermal Debt Atlas</div><div class="sb" id="sub">Dallas Fort Worth</div></div></header>
<main>
  <div id="err" class="err" hidden></div>
  <div class="now"><div class="t" id="tNow">—</div><div class="d" id="dNow">Waiting for the first weather check…</div></div>
  <div class="row">
    <div class="k"><div class="l">Peak heat index</div><div class="v" id="kHI">—</div><div class="s" id="kHIs">today</div></div>
    <div class="k"><div class="l">Hours 95°+</div><div class="v" id="k95">—</div><div class="s">next 72 hours</div></div>
    <div class="k"><div class="l">Alerts</div><div class="v" id="kAl">—</div><div class="s">twelve counties</div></div>
  </div>
  <div><div class="bars" id="bars" title="Heat index, next 48 hours"></div><div class="lbl"><span id="b0"></span><span id="b1"></span><span id="b2"></span></div></div>
  <div id="alerts"></div>
  <div class="btns">
    <button class="p" id="open">Open the atlas</button>
    <button class="g" id="weather">Weather desk</button>
    <button id="accounts">Accounts</button>
    <button id="refresh">Refresh weather</button>
  </div>
  <div class="foot"><span id="upd"></span><button class="lnk" id="opts">Options</button></div>
</main>
<script src="popup.js"></script>
</body>
</html>
