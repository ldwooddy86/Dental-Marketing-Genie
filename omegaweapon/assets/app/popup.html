<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmegaWeapon</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/popup.css">
</head>
<body class="popup">
<header class="p-head">
  <img src="icons/icon32.png" width="24" height="24" alt="">
  <div><div class="wm">OmegaWeapon</div><div class="muted tiny" id="count"></div></div>
</header>
<div class="p-search">
  <input type="search" id="q" placeholder="Search targets, agencies or domains" autocomplete="off" aria-label="Search targets and agencies">
  <div id="results" class="p-results" hidden></div>
</div>
<div id="site" class="p-site"></div>
<div class="row p-actions">
  <button class="btn primary" type="button" id="open">Open the app</button>
  <button class="btn" type="button" id="targets">Targets</button>
  <button class="btn" type="button" id="horus">Horus</button>
</div>
<footer class="p-foot">
  <div id="auto-host"></div>
  <p class="tiny muted" id="auto-note"></p>
  <p class="tiny muted">Shortcuts: Alt+Shift+R opens this, Alt+Shift+D the app, Alt+Shift+T the Targets wing. Type <span class="kbd">omega</span> then a space in the address bar to search.</p>
</footer>
<script src="js/index.js"></script>
<script src="js/popup.js"></script>
</body>
</html>
