<title>__HORUS_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-horus-webfont>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-horus-webfont>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Zilla+Slab:wght@500;600;700&display=swap" data-horus-webfont>
<style>
/* HORUS dashboard template. Tokens first; every colour below comes from them. */
:root{
  color-scheme: light;
  --ground:#F1F3F0; --surface:#FFFFFF; --surface-2:#F6F7F5; --sunken:#E5E9E6;
  --ink:#11181D; --ink-2:#46525A; --ink-3:#687479;
  --rule:#CFD6D2; --rule-2:#E1E6E3;
  --sun:#9A6405; --sun-bar:#C68A19; --sun-soft:#EDD5A3; --sun-tint:#FAF2E1;
  --moon:#34529E; --moon-bar:#4E6CBC; --moon-soft:#C9D4F1; --moon-tint:#EDF1FA;
  --accent:#0B6C55; --accent-tint:#DCEEE7;
  --crit:#AD3722; --crit-tint:#F7E2DC;
  --on-strong:#FFFFFF;
  --f-display:"Zilla Slab", Rockwell, "Roboto Slab", "DejaVu Serif", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0B1114; --surface:#121A1E; --surface-2:#172125; --sunken:#1F2A2F;
    --ink:#E2E8E6; --ink-2:#A8B3B3; --ink-3:#808D8F;
    --rule:#2B373C; --rule-2:#202A2F;
    --sun:#E6AE48; --sun-bar:#CF9632; --sun-soft:#5A4318; --sun-tint:#241D10;
    --moon:#9DB0EC; --moon-bar:#7089D6; --moon-soft:#2E3D69; --moon-tint:#151C30;
    --accent:#4FC7A2; --accent-tint:#0F2E27;
    --crit:#F1886F; --crit-tint:#381C16;
    --on-strong:#0B1114;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0B1114; --surface:#121A1E; --surface-2:#172125; --sunken:#1F2A2F;
  --ink:#E2E8E6; --ink-2:#A8B3B3; --ink-3:#808D8F;
  --rule:#2B373C; --rule-2:#202A2F;
  --sun:#E6AE48; --sun-bar:#CF9632; --sun-soft:#5A4318; --sun-tint:#241D10;
  --moon:#9DB0EC; --moon-bar:#7089D6; --moon-soft:#2E3D69; --moon-tint:#151C30;
  --accent:#4FC7A2; --accent-tint:#0F2E27;
  --crit:#F1886F; --crit-tint:#381C16;
  --on-strong:#0B1114;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.55 var(--f-body)}
img,svg{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
li+li{margin-top:4px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,3.2vw,36px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--ink);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:25px;font-weight:600}
h3{font-size:18.5px;font-weight:600}
h4{font:600 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow{font:500 11.5px/1.35 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.lede{max-width:76ch;color:var(--ink-2)}
.small{font-size:13px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 40px;padding-block:22px 18px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.wedjat{width:76px;height:auto;flex:none;color:var(--ink)}
.wedjat .iris{fill:var(--sun)}
.wedjat .tear{stroke:var(--moon)}
.wordmark{font:700 32px/1 var(--f-display);letter-spacing:.16em;color:var(--ink)}
.nomeline{margin-top:6px;font-size:13px;color:var(--ink-2)}
.docket{display:grid;grid-template-columns:repeat(4,auto);gap:6px 26px;margin:0}
.docket div{min-width:0}
.docket dt{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.docket dd{margin:2px 0 0;font:500 13px/1.35 var(--f-mono);color:var(--ink)}
@media (max-width:760px){.docket{grid-template-columns:repeat(2,minmax(0,auto))}}

/* tab rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ground);border-block:1px solid var(--rule)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:12px 13px 10px;font:600 13.5px/1.2 var(--f-body);color:var(--ink-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.tab .n{font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* layout */
main{padding-block:28px 72px}
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:46px}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0;scroll-margin-top:64px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 24px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.sec-head .aside{font-size:13px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--rule-2);border-radius:6px;padding:16px 18px;min-width:0}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px 28px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;min-width:0}
.kj-main,.kj-side,.find,.dos,.scen,.grave,.tile,.sig-body,.more-body,.arc-head{grid-template-columns:minmax(0,1fr)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);align-items:center}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{width:10px;height:10px;border-radius:50%;display:inline-block}
.key i.sun{background:var(--sun-bar)} .key i.moon{background:var(--moon-bar)}
.key i.bar{border-radius:1px;width:14px;height:8px}
.key i.dash{width:0;height:12px;border-left:1px dashed var(--ink-3);border-radius:0}

/* chips and tags */
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink-2);font:500 11.5px/1.3 var(--f-mono);white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--ink-3);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip .cn{color:var(--ink-3)}
button.chip[aria-pressed="true"] .cn{color:var(--ground);opacity:.75}
.tchip b{font-weight:600;color:var(--ink-3)}
.ref{appearance:none;background:none;border:0;padding:0 1px;font:500 12px/1.4 var(--f-mono);color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.ref:hover{text-decoration-style:solid}
.ref.dead{color:var(--ink-3);text-decoration:none;cursor:default}
.refs{display:flex;flex-wrap:wrap;gap:3px 9px}
.eye{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.eye::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.eye.sun{color:var(--sun)} .eye.moon{color:var(--moon)}
.cls{display:inline-block;font:600 10.5px/1.2 var(--f-mono);padding:3px 6px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
.cls.floor-led{background:var(--moon);color:var(--on-strong)}
.cls.leaning-floor{background:var(--moon-tint);color:var(--moon);border-color:var(--moon-soft)}
.cls.balanced{background:var(--surface-2);color:var(--ink-3);border-color:var(--rule-2)}
.cls.leaning-broadcast{background:var(--sun-tint);color:var(--sun);border-color:var(--sun-soft)}
.cls.broadcast-led{background:var(--sun);color:var(--on-strong)}
.cls.broadcast-only{color:var(--sun);border-color:var(--sun)}
.cls.floor-only{color:var(--moon);border-color:var(--moon)}
.grade{display:inline-block;font:600 11.5px/1 var(--f-mono);padding:4px 6px;border-radius:3px;border:1px solid var(--ink-3);color:var(--ink);white-space:nowrap}
.grade.gA{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.grade.gB{background:var(--sunken)}
.grade.gD,.grade.gE,.grade.gF,.grade.gX{border-style:dashed;color:var(--ink-3)}
.flag{display:inline-block;font:600 10.5px/1.2 var(--f-mono);padding:2px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em}
.flag.grey{background:var(--crit-tint);color:var(--crit)}
.flag.set{border:1px dashed var(--ink-3);color:var(--ink-3)}
.stage{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.arc{flex:none;overflow:visible}
.arc .hz{stroke:var(--ink-3);stroke-width:1.2}
.arc .path{fill:none;stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:2 2}
.arc .sunmark{fill:var(--ink)}
.arc .sunmark.under{fill:var(--ground);stroke:var(--ink);stroke-width:1.4}
.mom{font:500 12px/1 var(--f-mono);white-space:nowrap;color:var(--ink-2)}
.mom b{font-weight:600;color:var(--ink);letter-spacing:-.1em;margin-right:4px}
.mmwrap{display:inline-flex;gap:8px;font:500 11.5px/1 var(--f-mono);white-space:nowrap}
.mm{opacity:.72}.mm.s{color:var(--sun)}.mm.m{color:var(--moon)}.mm.sig{opacity:1;font-weight:700}

/* brief */
.brief-top{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:28px 48px;align-items:start}
@media (max-width:920px){.brief-top{grid-template-columns:minmax(0,1fr)}}
.headline{font-size:clamp(28px,3.3vw,42px);font-weight:600;line-height:1.1;max-width:26ch;margin-block:10px 18px}
.bluf{max-width:70ch;font-size:15.5px;color:var(--ink-2)}
.bluf+.bluf{margin-top:12px}
.bluf.first{font-size:17px;color:var(--ink)}
.instruments{display:grid;gap:0;align-content:start}
.inst{display:grid;grid-template-columns:78px minmax(0,1fr);gap:2px 14px;align-items:baseline;padding-block:11px;border-top:1px solid var(--rule-2)}
.inst:first-of-type{border-top:0}
.inst .big{font:600 26px/1 var(--f-mono);grid-row:span 2;color:var(--ink)}
.inst .big.sun{color:var(--sun)} .inst .big.moon{color:var(--moon)}
.inst .lab{font-size:13.5px;font-weight:600}
.inst .sub{font-size:12.5px;color:var(--ink-3)}
.cov-list{display:flex;flex-wrap:wrap;gap:6px}
.cov{display:inline-flex;gap:7px;align-items:baseline;padding:4px 8px;border-radius:3px;font-size:12.5px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.cov .st{font:500 10.5px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.cov.full{border-color:var(--ink-3)}
.cov.none{border-style:dashed;color:var(--ink-3);background:transparent}
.cov.blocked{border-color:var(--crit);color:var(--crit)}
.cov.blocked .st{color:var(--crit)}
.extremes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px 22px}
.ext-list{display:grid;gap:4px;font-size:13px}
.ext-list div{display:flex;justify-content:space-between;gap:10px}

/* key judgments */
.kj-grid{display:grid;gap:14px}
.kj{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:14px 34px;align-items:start;scroll-margin-top:70px}
.kj-main,.kj-side{display:grid;gap:10px;align-content:start;min-width:0}
@media (max-width:860px){.kj{grid-template-columns:minmax(0,1fr)}}
.kj-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.kj-id{font:600 12px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.kj .txt{color:var(--ink-2);font-size:14.5px}
.lik{display:grid;gap:6px}
.lik-row{display:grid;grid-template-columns:minmax(0,150px) minmax(90px,1fr) auto;gap:12px;align-items:center}
.lik-term{font-weight:600;font-size:13.5px;line-height:1.25}
.lik-term span{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.lik-range{font:500 12px/1 var(--f-mono);color:var(--ink-2)}
.prob{position:relative;height:10px;background:var(--sunken);border-radius:2px}
.prob .band{position:absolute;top:0;bottom:0;background:var(--ink);border-radius:2px}
.prob .tick{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--surface)}
.kj-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--ink-2);align-items:center}
.kj-meta b{color:var(--ink);font-weight:600}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.pips i.on{background:var(--ink)}
.pips i.half{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
details.more{border-top:1px solid var(--rule-2);padding-top:9px}
details.more summary{cursor:pointer;font:600 12px/1.4 var(--f-mono);color:var(--ink-2);letter-spacing:.02em}
details.more summary:hover{color:var(--ink)}
details.more[open] summary{margin-bottom:10px}
.more-body{display:grid;gap:12px}
.math{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px;background:var(--surface-2);border:1px solid var(--rule-2);border-radius:4px;padding:10px 12px}
.math dt{font:500 11.5px/1.5 var(--f-mono);color:var(--ink-3)}
.math dd{margin:0}
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:4px 28px}
.move{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding-block:12px;border-top:1px solid var(--rule-2)}
.move .mid{font:600 12px/1.6 var(--f-mono);color:var(--ink-3)}
.move h3{font-size:16.5px}
.move p{grid-column:2;font-size:13.5px;color:var(--ink-2)}
.move .refs{grid-column:2}

/* findings */
.finds{row-gap:30px}
.find{display:grid;gap:8px;align-content:start;border-top:2px solid var(--ink);padding-top:10px;scroll-margin-top:80px}
.find .fid{font:600 11.5px/1 var(--f-mono);color:var(--ink-3)}
.find h3{font-size:16.5px}
.find p{font-size:13.5px;color:var(--ink-2)}

/* diverging chart */
.dv{display:grid;gap:1px}
.dv-row,.dv-axis{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 54px;gap:12px;align-items:center}
.dv-row{min-height:24px;border-radius:3px;scroll-margin-top:80px}
.dv-row:hover{background:var(--surface-2)}
.dv-lab{font-size:13px;line-height:1.2;padding-block:2px}
.dv-lab .tid{font:500 11px var(--f-mono);color:var(--ink-3);margin-right:6px}
.dv-track{position:relative;height:18px}
.dv-track .axis{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.dv-track .crit{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1px dashed var(--rule)}
.dv-bar{position:absolute;top:3px;bottom:3px;border-radius:2px}
.dv-bar.pos{background:var(--moon-bar)} .dv-bar.neg{background:var(--sun-bar)}
.dv-bar.weak{opacity:.4}
.dv-val{font:500 12px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.dv-ticks{position:relative;height:16px;font:500 10.5px/16px var(--f-mono);color:var(--ink-3)}
.dv-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.dv-cap{display:flex;justify-content:space-between;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.dv-cap .l{color:var(--sun)} .dv-cap .r{color:var(--moon)}

/* dumbbell */
.db{display:grid;gap:2px}
.db-row,.db-axis{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) 96px;gap:12px;align-items:center}
.db-row{min-height:26px}
.db-lab{font-size:13px;line-height:1.2}
.db-track{position:relative;height:20px}
.db-track .base{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule-2)}
.db-track .gl{position:absolute;top:2px;bottom:2px;width:1px;background:var(--rule-2)}
.db-line{position:absolute;top:calc(50% - 1px);height:2px;background:var(--ink-3);opacity:.55}
.db-dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface)}
.db-dot.sun{background:var(--sun-bar)} .db-dot.moon{background:var(--moon-bar)}
.db-vals{font:500 11.5px/1 var(--f-mono);display:flex;gap:8px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.db-vals .s{color:var(--sun)} .db-vals .m{color:var(--moon)}
.db-ticks{position:relative;height:14px;font:500 10.5px/14px var(--f-mono);color:var(--ink-3)}
.db-ticks span{position:absolute;transform:translateX(-50%)}
.db-ticks span:first-child{transform:none}

/* butterfly */
.bf{display:grid;gap:3px}
.bf-row,.bf-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(100px,150px) minmax(0,1fr);gap:10px;align-items:center}
.bf-row{min-height:24px}
.bf-head{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.bf-head .l{text-align:right;color:var(--sun)} .bf-head .r{color:var(--moon)}
.bf-side{position:relative;height:16px}
.bf-side .bar{position:absolute;top:0;bottom:0;border-radius:2px}
.bf-side.l .bar{right:0;background:var(--sun-bar)}
.bf-side.r .bar{left:0;background:var(--moon-bar)}
.bf-side .v{position:absolute;top:0;font:500 11.5px/16px var(--f-mono);white-space:nowrap;color:var(--ink-2)}
.bf-lab{text-align:center;font-size:12.5px;line-height:1.2}
.bf-lab b{font:600 11px var(--f-mono);color:var(--ink-3);margin-right:4px}

/* bar list */
.bl{display:grid;gap:3px}
.bl-row{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 78px;gap:12px;align-items:center;min-height:24px}
.bl-lab{font-size:13px;line-height:1.2}
.bl-track{position:relative;height:14px;background:var(--surface-2);border-radius:2px}
.bl-track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--moon-bar)}
.bl-track.sun i{background:var(--sun-bar)}
.bl-val{font:500 12px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* tables */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--rule-2);border-radius:6px}
.tbl.scroll{max-height:74vh;overflow:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--rule);background:var(--surface-2);white-space:nowrap;vertical-align:bottom}
.tbl.scroll th{position:sticky;top:0;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .nw{white-space:nowrap}
.tbl tr{scroll-margin-top:90px}
th .sort{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th .sort:hover{color:var(--ink)}
th[aria-sort="ascending"] .sort::after{content:"\25B2";font-size:8px}
th[aria-sort="descending"] .sort::after{content:"\25BC";font-size:8px}
.tlab{display:grid;gap:1px;min-width:150px}
.tbl.tg th{white-space:normal;padding-inline:8px}
.tbl.tg td{padding-inline:8px}
.tlab .t{font-weight:600;font-size:13.5px}
.tlab .c{font:500 10.5px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.03em}
.mb{display:grid;grid-template-columns:48px auto;gap:7px;align-items:center;white-space:nowrap}
.mb .tr{position:relative;height:8px;background:var(--sunken);border-radius:1px}
.mb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:1px}
.mb.sun .tr i{background:var(--sun-bar)} .mb.moon .tr i{background:var(--moon-bar)}
.mb span{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.mb span em{font-style:normal;color:var(--ink-3)}
.zc{display:grid;justify-items:end;gap:4px;white-space:nowrap}

/* heat matrix */
.hm td.cell{position:relative;text-align:center;font:500 12px/1 var(--f-mono);min-width:58px;vertical-align:middle;padding:10px 6px}
.hm .fill{position:absolute;inset:3px;border-radius:2px}
.hm .fill.sun{background:var(--sun-bar)} .hm .fill.moon{background:var(--moon-bar)}
.hm .v{position:relative}
.hm td.zero{color:var(--ink-3)}
.adm{border-collapse:separate;border-spacing:3px}
.adm th{font:600 11px/1.2 var(--f-mono);color:var(--ink-3);padding:4px 6px;text-align:center}
.adm th.rowh{text-align:left;white-space:nowrap}
.adm td{width:46px;height:34px;text-align:center;position:relative;background:var(--surface-2);border-radius:3px;font:600 12.5px/1 var(--f-mono)}
.adm td .fill{position:absolute;inset:0;background:var(--ink);border-radius:3px}
.adm td .v{position:relative}
.adm td.hi .v{color:var(--ground)}
.adm-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 32px;align-items:start}
@media (max-width:760px){.adm-wrap{grid-template-columns:minmax(0,1fr)}}
.scale-list{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:12.5px;color:var(--ink-2)}
.scale-list b{font:600 12px var(--f-mono);color:var(--ink)}

/* histogram */
.hist{display:grid;gap:6px}
.hist-bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--rule)}
.hist-bars i{flex:1;background:var(--sun-bar);border-radius:2px 2px 0 0;min-height:1px;position:relative}
.hist-bars i.zero{background:transparent}
.hist-x{display:flex;gap:3px;font:500 10.5px/1 var(--f-mono);color:var(--ink-3)}
.hist-x span{flex:1;text-align:center;overflow:visible;white-space:nowrap}

/* dossiers */
.dos{display:grid;gap:10px;align-content:start}
.dos-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.dos h3{font-size:17px}
.dos .coll{font:500 11.5px/1.4 var(--f-mono);color:var(--ink-3)}
.dos ul{font-size:13.5px;color:var(--ink-2)}
.dos .talk{display:grid;gap:5px;padding:9px 10px;background:var(--surface-2);border-radius:4px}
.status{font:600 10.5px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border-radius:3px;border:1px solid var(--ink-3);color:var(--ink-2);white-space:nowrap}
.status.full{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.status.none{border-style:dashed;color:var(--ink-3)}
.status.blocked{border-color:var(--crit);color:var(--crit)}

/* nilometer */
.sigs{display:grid;background:var(--surface);border:1px solid var(--rule-2);border-radius:6px}
.sig{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:4px 14px;padding:13px 14px;border-top:1px solid var(--rule-2);scroll-margin-top:90px}
.sig:first-child{border-top:0}
.sig-id{font:600 12px/1.5 var(--f-mono);color:var(--ink-3)}
.sig-body{display:grid;gap:4px;min-width:0}
.sig-metric{font-weight:600;font-size:14px;line-height:1.35}
.sig-value{font:500 14px/1.4 var(--f-mono);color:var(--ink)}
.sig-note{font-size:13px;color:var(--ink-2);max-width:92ch}
.sig-foot{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-3);align-items:center}
.sig-dom{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
@media (max-width:600px){.sig{grid-template-columns:40px minmax(0,1fr)}.sig-grade{grid-column:2}}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field label{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
select,input[type="search"]{font:400 13.5px/1.2 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;max-width:100%}
input[type="search"]{width:min(100%,280px)}
.btn{appearance:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:600 13px/1.2 var(--f-body);padding:8px 12px;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.count{font:500 12.5px/1.2 var(--f-mono);color:var(--ink-3)}

/* forecast */
.arcband{display:grid;grid-template-columns:minmax(190px,240px) minmax(0,1fr);gap:14px 22px;padding-block:18px;border-top:1px solid var(--rule-2)}
.arcband:first-child{border-top:0;padding-top:4px}
@media (max-width:720px){.arcband{grid-template-columns:minmax(0,1fr)}}
.arc-head{display:grid;gap:6px;align-content:start}
.arc-head .nm{display:flex;align-items:center;gap:10px}
.arc-head .nm h3{font-size:21px}
.arc-head p{font-size:13px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--rule-2);border-radius:5px;padding:10px 12px;display:grid;gap:5px;align-content:start}
.tile-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tile-top .t{font-weight:600;font-size:13.5px;line-height:1.25}
.tile .why{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.tile .eyes{display:flex;gap:10px;font:500 11px/1 var(--f-mono)}
.tile .eyes .s{color:var(--sun)} .tile .eyes .m{color:var(--moon)}
.quad{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto;gap:10px}
.qx{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;align-self:end}
.qy{writing-mode:vertical-rl;transform:rotate(180deg);font:600 10.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;justify-self:center}
.qaxis{grid-column:2 / 4;display:flex;justify-content:space-between;font:500 11px/1.2 var(--f-mono);color:var(--ink-3)}
.q-tl{grid-column:2;grid-row:1}.q-tr{grid-column:3;grid-row:1}.q-bl{grid-column:2;grid-row:2}.q-br{grid-column:3;grid-row:2}
.qy.top{grid-column:1;grid-row:1}.qy.bot{grid-column:1;grid-row:2}
.scen{display:grid;gap:9px;align-content:start;scroll-margin-top:80px}
.scen-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.scen .p{font:600 30px/1 var(--f-mono);color:var(--ink)}
.scen .pbar{height:4px;background:var(--sunken);border-radius:2px}
.scen .pbar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.scen .ax{font:500 11px/1.3 var(--f-mono);color:var(--ink-3)}
.scen p{font-size:13.5px;color:var(--ink-2)}
.scen ul{font-size:13px;color:var(--ink-2)}
@media (max-width:760px){
  .quad{grid-template-columns:minmax(0,1fr)}
  .q-tl,.q-tr,.q-bl,.q-br{grid-column:auto;grid-row:auto}
  .qy,.qaxis{display:none}
}
.ach th.h{text-align:center;min-width:92px}
.ach th.h span{display:block;font:500 10.5px/1.2 var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink-2);margin-top:3px}
.ach td.r{text-align:center;font:600 12px/1 var(--f-mono);vertical-align:middle}
.ach td.rC{background:var(--sunken);color:var(--ink)}
.ach td.rI{background:var(--crit-tint);color:var(--crit)}
.ach td.rN{color:var(--ink-3)}
.ach tfoot td{font:600 12px/1.2 var(--f-mono);border-top:1px solid var(--rule);background:var(--surface-2)}
.ach tfoot td.best{color:var(--accent)}
.hyps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px 22px}
.hyp{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 8px;font-size:13px;color:var(--ink-2)}
.hyp b{font:600 12px/1.5 var(--f-mono);color:var(--ink)}
.hyp strong{color:var(--ink);font-weight:600}
.callout{border-left:3px solid var(--ink);padding:10px 14px;background:var(--surface);font-size:14px;color:var(--ink-2);max-width:92ch}
.callout b{color:var(--ink)}
.grave{display:grid;gap:8px;align-content:start}
.grave .when{font:500 11.5px/1.2 var(--f-mono);color:var(--ink-3)}
.grave h3{font-size:16.5px}
.grave p{font-size:13.5px;color:var(--ink-2)}
.grave .lesson{color:var(--ink)}
.unk{display:grid;grid-template-columns:36px minmax(0,1fr);gap:3px 10px;padding-block:12px;border-top:1px solid var(--rule-2)}
.unk b{font:600 12px/1.6 var(--f-mono);color:var(--ink-3)}
.unk h3{font-size:16px}
.unk p{grid-column:2;font-size:13.5px;color:var(--ink-2)}
.cal{display:grid;gap:0}
.cal-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:4px 14px;padding-block:9px;border-top:1px solid var(--rule-2);align-items:baseline;font-size:13.5px}
.cal-row:first-child{border-top:0}
.cal-row .d{font:500 12px/1.3 var(--f-mono);color:var(--ink)}
@media (max-width:600px){.cal-row{grid-template-columns:minmax(0,1fr)}}

/* timeline */
.tl{display:grid;gap:18px}
.tl-month{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px}
.tl-mlab{font:600 11.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.tl-list{display:grid;gap:10px;border-left:2px solid var(--rule);padding-left:18px}
.tl-ev{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 12px;position:relative;scroll-margin-top:90px}
.tl-ev::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--ground)}
.tl-ev.future::before{background:var(--ground);border:2px solid var(--accent)}
.tl-ev .d{font:500 12px/1.5 var(--f-mono);color:var(--ink-2)}
.tl-ev .l{font-size:14px;line-height:1.4}
.tl-ev .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tl-now{display:flex;align-items:center;gap:10px;font:600 11px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.tl-now::after{content:"";flex:1;border-top:1px dashed var(--accent)}
.watchtag{font:600 10px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:2px 5px}
@media (max-width:640px){.tl-month{grid-template-columns:minmax(0,1fr)}.tl-ev{grid-template-columns:minmax(0,1fr)}.tl-ev .meta{grid-column:1}}

/* ledger */
tr.is-set td{color:var(--ink-3)}
tr.is-set .ttl{text-decoration:line-through;text-decoration-thickness:1px}
.ttl{min-width:220px;max-width:440px;display:block}
.src{display:grid;gap:1px;min-width:180px}
.eyedot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.eyedot.sun{background:var(--sun-bar)} .eyedot.moon{background:var(--moon-bar)}
.filters select{width:auto;max-width:290px}
.field{max-width:100%}
.stagedef{display:flex;gap:8px;align-items:flex-start;margin-block:4px}
.stagedef .arc{margin-top:-2px}
.top{align-items:start}
.src .p{font-weight:600;font-size:13px}
.src .c{font-size:12px;color:var(--ink-3)}
.st{font:600 12px var(--f-mono)}

/* method */
.defs{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:0 22px}
.defs dt{font-weight:600;font-size:14px;padding-block:10px;border-top:1px solid var(--rule-2)}
.defs dd{margin:0;padding-block:10px;border-top:1px solid var(--rule-2);font-size:14px;color:var(--ink-2)}
@media (max-width:640px){.defs{grid-template-columns:minmax(0,1fr)}.defs dd{border-top:0;padding-top:0}}
.formula{font:500 12.5px/1.7 var(--f-mono);background:var(--surface);border:1px solid var(--rule-2);border-radius:4px;padding:12px 14px;overflow-x:auto;white-space:pre;color:var(--ink)}
.limits{display:grid;gap:8px;font-size:14px;color:var(--ink-2);max-width:92ch}
.foot{padding-block:22px 40px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.flash{animation:flash 2s ease-out 1}
@keyframes flash{0%{background-color:var(--accent-tint);box-shadow:0 0 0 2px var(--accent)}70%{background-color:var(--accent-tint)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--accent)}}
.noscript{padding:24px;border:1px solid var(--rule);background:var(--surface)}
</style>

    p.append(h('div', { class: 'sec' },
      secHead('Measures', 'What each number on this page means'),
      h('dl', { class: 'defs' },
        h('dt', null, 'Share of voice'), h('dd', null, cap(md.sov || 'primary topic share of counted items in each eye') + '.'),
        h('dt', null, 'Stereopsis'), h('dd', null, cap(md.stereopsis || '') + '. Following Monroe, Colaresi and Quinn (2008), the prior shrinks small counts so that rare topics do not produce extreme gaps by chance.',
          h('pre', { class: 'formula', style: 'margin-top:10px' },
            'delta_w = log[(yF_w + a_w) / (nF + a0 − yF_w − a_w)] − log[(yB_w + a_w) / (nB + a0 − yB_w − a_w)]\n' +
            'var_w   ≈ 1 / (yF_w + a_w) + 1 / (yB_w + a_w)          z_w = delta_w / sqrt(var_w)\n' +
            'a0 = number of topics;  a_w = a0 × max(pooled_w, 0.5) / (n_pooled + 0.5 × topics)')),
        h('dt', null, 'Class'), h('dd', null, 'Floor-led or broadcast-led beyond |z| 1.96; leaning between 1 and 1.96; balanced below 1. A topic with no items in one eye (and at least three, or two, in the other) is broadcast-only or floor-only.'),
        h('dt', null, 'Pain'), h('dd', null, cap(md.pain || '') + '.'),
        h('dt', null, 'Reply-weighted floor'), h('dd', null, cap(md.weighted_floor || '') + '.'),
        h('dt', null, 'Set filter'), h('dd', null, (CODES.flags || {}).set || ''),
        h('dt', null, 'Grey flag'), h('dd', null, (CODES.flags || {}).grey || ''),
        h('dt', null, 'Stage'), h('dd', null, STAGE_ORDER.map(function (s) { return h('div', { class: 'stagedef' }, arcGlyph(s), h('span', null, h('b', null, s + ' (' + STAGE_DEF[s][0].toLowerCase() + ').'), ' ' + STAGE_DEF[s][1])); })),
        h('dt', null, 'Momentum'), h('dd', null, MM ? 'Measured against edition ' + M.momentum.previous_edition + ' (run ' + fmtDate(M.momentum.previous_run_date) + '): the change in each eye’s share of counted items, with a two-proportion z-score. Bold changes clear |z| 1.96.' : (MOM._note || 'Directional judgment from the hard signals.')),
        h('dt', null, 'Likelihood'), h('dd', null, h('div', { class: 'scale-list' }, ICD.map(function (t) { return [h('b', null, t[1] + '–' + t[2] + '%'), h('span', null, t[0])]; })), h('p', { class: 'small muted', style: 'margin-top:6px' }, 'ICD 203 expressions of likelihood. Confidence (low, moderate, high) grades the evidence base separately.')),
        h('dt', null, 'Intent codes'), h('dd', null, h('div', { class: 'scale-list' }, Object.keys(CODES.intent || {}).map(function (c) { return [h('b', null, c), h('span', null, CODES.intent[c])]; }))))));

    var kap = D.kappa;
    if (kap) {
      var dis = kap.disagreements || [];
      p.append(h('div', { class: 'sec' },
        secHead('Reliability', 'Blind second coder on a random sample'),
        h('div', { class: 'tbl' }, h('table', null,
          h('thead', null, h('tr', null, h('th', null, 'Code'), h('th', { class: 'num' }, 'Items'), h('th', { class: 'num' }, 'Agreement'), h('th', { class: 'num' }, 'Cohen’s κ'), h('th', null, 'Reading (Landis and Koch)'))),
          h('tbody', null, ['topic', 'cluster', 'intent'].filter(function (k) { return kap[k]; }).map(function (k) {
            return h('tr', null, h('td', null, cap(k)), h('td', { class: 'num' }, String(kap[k].n)), h('td', { class: 'num' }, pct(kap[k].agreement, 1)), h('td', { class: 'num' }, (kap[k].kappa || 0).toFixed(3)), h('td', null, kap[k].reading || ''));
          })))),
        dis.length ? h('details', { class: 'more' }, h('summary', null, dis.length + ' items with any disagreement'),
          h('div', { class: 'tbl' }, h('table', null,
            h('thead', null, h('tr', null, h('th', null, 'Item'), h('th', null, 'Title'), h('th', null, 'First coder'), h('th', null, 'Second coder'))),
            h('tbody', null, dis.map(function (d) {
              return h('tr', null, h('td', null, refChip(d.id)), h('td', { class: 'small' }, d.title), h('td', { class: 'mono nw' }, d.first.join(' · ')), h('td', { class: 'mono nw' }, d.second.join(' · ')));
            }))))) : null));
    }

    var lim = A.limitations || [];
    if (lim.length) p.append(h('div', { class: 'sec' },
      secHead('Limitations', lim.length + ' known limits of this edition'),
      h('ol', { class: 'limits' }, lim.map(function (l) { return h('li', null, l); }))));
    var sq = NOME.standing_questions || [];
    if (sq.length) p.append(h('div', { class: 'sec' },
      secHead('Standing questions', 'Asked of every edition of this nome'),
      h('ol', { class: 'limits' }, sq.map(function (q) { return h('li', null, q); }))));
    p.append(h('div', { class: 'sec' },
      secHead('Rebuild this page', 'From the Horus skill folder'),
      h('pre', { class: 'formula' },
        'python scripts/horus_validate.py --edition ' + (META.ledger_file || 'assets/editions/<edition>.json') + '\n' +
        'python scripts/horus_build.py --edition ' + (META.ledger_file || 'assets/editions/<edition>.json') + ' --out horus-dashboard.html')));
  })();

  /* ---------- footer ---------- */
  document.getElementById('foot').append(
    h('span', null, 'Horus · ' + (NOME.name || '') + ' · edition ' + (META.edition || '') + ' · run ' + fmtDate(META.run_date)),
    h('span', null, int(ITEMS.length) + ' items · ' + int(ROOMS.length) + ' rooms · ' + int(SIGS.length) + ' signals, each linked to its source'));

  var start = (location.hash || '').replace('#', '');
  showTab(panels[start] ? start : 'brief', false);
})();
</script>
